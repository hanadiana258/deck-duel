<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck Duel</title>
<style>
  :root { --ink:#f2ead8; --gold:#e8b64c; --red:#d9534f; --blue:#5b8fd9; --green:#57a65a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#141821; color:var(--ink); font-family:Georgia,'Times New Roman',serif; height:100vh; overflow:hidden; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .hidden { display:none; }
  #title h1 { font-size:64px; color:var(--gold); letter-spacing:6px; text-shadow:0 3px 0 #6b4a12; }
  #title p { font-size:18px; opacity:.85; }
  button { font-family:inherit; font-size:20px; padding:10px 34px; background:var(--gold); color:#241a06; border:none; border-radius:8px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #table { background:radial-gradient(circle at 50% 30%, #232a38 0%, #141821 70%); }
  #topbar { width:100%; display:flex; justify-content:space-between; padding:14px 26px; font-size:20px; }
  .hpwrap { display:flex; gap:16px; align-items:center; }
  .hpbar { width:220px; height:18px; background:#2a2f3c; border-radius:9px; overflow:hidden; border:1px solid #000; }
  .hpfill { height:100%; background:var(--green); transition:width .3s; }
  #arena { display:flex; align-items:center; justify-content:center; gap:60px; flex:1; width:100%; }
  .played { width:150px; min-height:210px; border:2px dashed #3c4356; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:40px; }
  #log { width:520px; text-align:center; font-size:18px; min-height:52px; color:#cfd6e4; }
  #hand { display:flex; gap:14px; padding:12px 0 24px; min-height:240px; }
  .card { width:132px; height:186px; border-radius:12px; background:linear-gradient(160deg,#f7f1e1,#e5d9bd); color:#241a06;
          padding:10px; cursor:pointer; border:3px solid transparent; position:relative; transition:transform .15s; user-select:none; }
  .card:hover { transform:translateY(-10px); }
  .card.selected { border-color:var(--gold); transform:translateY(-14px); }
  .card.unplayable { opacity:.45; cursor:not-allowed; }
  .card h3 { font-size:17px; text-align:center; margin-bottom:6px; }
  .card .icon { font-size:44px; text-align:center; margin:10px 0; }
  .card .stats { position:absolute; bottom:8px; left:10px; right:10px; font-size:14px; display:flex; justify-content:space-between; }
  .card .cost { position:absolute; top:6px; right:8px; background:var(--blue); color:#fff; border-radius:50%;
                width:26px; height:26px; line-height:26px; text-align:center; font-size:15px; font-weight:bold; }
  #handbar { display:flex; gap:26px; align-items:center; font-size:19px; }
  #endmsg { font-size:44px; }
  #endstats { font-size:19px; opacity:.85; }
</style>
</head>
<body>

<section id="title" class="screen">
  <h1>DECK DUEL</h1>
  <p>Outlast the Arcanist. Spend mana, play your five-card hand, strike when she is open.</p>
  <button id="startBtn">Deal me in</button>
  <p style="font-size:15px;opacity:.6">Click a card to play it &middot; N key ends your turn</p>
</section>

<section id="table" class="screen hidden">
  <div id="topbar">
    <span class="hpwrap">You <div class="hpbar"><div class="hpfill" id="php"></div></div> <span id="phpn">20</span></span>
    <span id="turnlbl" style="color:var(--gold)">Your turn</span>
    <span class="hpwrap"><span id="ehpn">20</span> <div class="hpbar"><div class="hpfill" id="ehp"></div></div> The Arcanist</span>
  </div>
  <div id="arena">
    <div class="played" id="pplayed">🂠</div>
    <div id="log">The duel begins.</div>
    <div class="played" id="eplayed">🂠</div>
  </div>
  <div id="handbar"><span>Mana <b id="manaN">3/3</b></span><button id="endBtn">End turn (N)</button></div>
  <div id="hand"></div>
</section>

<section id="end" class="screen hidden">
  <div id="endmsg"></div>
  <div id="endstats"></div>
  <button id="againBtn">Duel again</button>
</section>

<script type="module" src="src/main.js?v=14"></script>
</body>
</html>
